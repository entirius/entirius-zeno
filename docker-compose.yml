services:
  # --- Infrastructure ---------------------------------------------------

  db:
    image: postgres:16-alpine
    profiles: [infra]
    ports:
      - "${POSTGRES_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entirius}
      POSTGRES_USER: ${POSTGRES_USER:-entirius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entirius-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entirius}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeno

  redis:
    image: redis:7-alpine
    profiles: [infra]
    ports:
      - "${REDIS_PORT:-6479}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeno

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [infra]
    ports:
      - "${RABBITMQ_PORT:-5772}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15772}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - zeno

  # --- Service under test -----------------------------------------------

  service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        service: ${SERVICE:-entirius-service-volkanos}
        branch: ${SERVICE_BRANCH:-master}
        ref: ${SERVICE_REF:-unknown}
    profiles: [service]
    tty: true
    ports:
      - "${SERVICE_PORT:-8100}:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,service
      DATABASE_URL: postgresql://${POSTGRES_USER:-entirius}:${POSTGRES_PASSWORD:-entirius-dev}@db:5432/${POSTGRES_DB:-entirius}
    volumes:
      # Emporium test package (make clone-tests) — seed scripts and QMS csv_path expect this path
      - ${TESTS_PATH:-./repos/tests}/entirius-test-package-emporium:/entirius/test-package:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zeno

  # --- Frontends (demo storefront + admin CMS) ---------------------------

  pwa:
    build:
      context: .
      dockerfile: docker/Dockerfile.pwa
      args:
        repo: entirius-pwa-storefront-demo
        branch: ${PWA_BRANCH:-develop}
        ref: ${PWA_REF:-unknown}
    profiles: [pwa]
    ports:
      - "${PWA_PORT:-3100}:3000"
    environment:
      # Nuxt 3 runtime overrides use the NUXT_ / NUXT_PUBLIC_ prefixes (plain names
      # are only read at build time). Server-side calls go container-to-container;
      # the browser hits the host port.
      NUXT_API_BASE_URL: http://service:8000/api
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${SERVICE_PORT:-8100}/api
      NUXT_PUBLIC_API_BASE_V: "1"
      NUXT_PUBLIC_DEFAULT_CHANEL: ${PWA_CHANNEL:-default-europe}
      NUXT_PUBLIC_STORE_ID: ${PWA_STORE_ID:-global}
      NUXT_PUBLIC_API_CHECKOUT_KEY: ${CHECKOUT_API_KEY:-entirius-docker-checkout-dev-key-2026}
      NUXT_PUBLIC_EXP_TIME: "300000"
      NUXT_PUBLIC_THEME_MODE: both
    networks:
      - zeno

  cms:
    build:
      context: .
      dockerfile: docker/Dockerfile.cms
      args:
        repo: entirius-pwa-cms
        branch: ${CMS_BRANCH:-develop}
        ref: ${CMS_REF:-unknown}
    profiles: [cms]
    ports:
      - "${CMS_PORT:-8180}:8080"
    environment:
      # SPA — the browser talks to the service host port directly.
      VUE_APP_API_URL: http://localhost:${SERVICE_PORT:-8100}
      VUE_APP_CHANNEL: ${PWA_CHANNEL:-default-europe}
      VUE_APP_PANELS: pages,pim,points
      VUE_APP_LANG: EN
    networks:
      - zeno

  # Static HTTP for the test package (supplier feed downloads — the feed connector
  # speaks HTTP only). In-network only: no host port.
  fixtures:
    image: python:3.12-slim
    profiles: [service]
    command: ["python", "-m", "http.server", "8000", "--directory", "/entirius/test-package"]
    volumes:
      - ${TESTS_PATH:-./repos/tests}/entirius-test-package-emporium:/entirius/test-package:ro
    networks:
      - zeno

  # Celery worker — required by `make seed` (QMS quantities import runs as tasks).
  # Same image as the service; in dev mode it runs the BAKED code (no hot reload).
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        service: ${SERVICE:-entirius-service-volkanos}
        branch: ${SERVICE_BRANCH:-master}
        ref: ${SERVICE_REF:-unknown}
    profiles: [service]
    command: ["celery", "-A", "main", "worker", "-l", "info", "-Q", "celery,quantities,fill_product_representation,pricemanager_create_pricelist"]
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,service
      DATABASE_URL: postgresql://${POSTGRES_USER:-entirius}:${POSTGRES_PASSWORD:-entirius-dev}@db:5432/${POSTGRES_DB:-entirius}
    volumes:
      - ${TESTS_PATH:-./repos/tests}/entirius-test-package-emporium:/entirius/test-package:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zeno

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  zeno:
    name: entirius-zeno
