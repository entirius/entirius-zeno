services:
  # --- Infrastructure ---------------------------------------------------

  db:
    # pgvector build of Postgres 16 (lookup module: vector + pg_trgm + unaccent). Extensions are
    # created by module migrations — the harness only guarantees they are available.
    image: pgvector/pgvector:pg16
    profiles: [infra]
    ports:
      - "${POSTGRES_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entirius}
      POSTGRES_USER: ${POSTGRES_USER:-entirius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entirius-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entirius}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeno

  redis:
    image: redis:7-alpine
    profiles: [infra]
    ports:
      - "${REDIS_PORT:-6479}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeno

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [infra]
    ports:
      - "${RABBITMQ_PORT:-5772}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15772}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - zeno

  # --- Service under test -----------------------------------------------

  service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        service: ${SERVICE:-entirius-service-volkanos}
        branch: ${SERVICE_BRANCH:-master}
        ref: ${SERVICE_REF:-unknown}
    profiles: [service]
    tty: true
    ports:
      - "${SERVICE_PORT:-8100}:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,service
      DATABASE_URL: postgresql://${POSTGRES_USER:-entirius}:${POSTGRES_PASSWORD:-entirius-dev}@db:5432/${POSTGRES_DB:-entirius}
      EMBED_MODEL: ${EMBED_MODEL:-google/siglip-so400m-patch14-384}
      EMBED_DIM: ${EMBED_DIM:-1152}
    volumes:
      # Emporium test package (make clone-tests) — seed scripts and QMS csv_path expect this path
      - ${TESTS_PATH:-./repos/tests}/entirius-test-package-emporium:/entirius/test-package:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zeno

  # --- Frontends (storefront + admin CMS) --------------------------------

  # No environment block: the storefront is configured only by _CONFIG/*.json,
  # imported statically and therefore baked in at image build (see Dockerfile.pwa).
  pwa:
    build:
      context: .
      dockerfile: docker/Dockerfile.pwa
      args:
        repo: entirius-pwa-storefront
        branch: ${PWA_BRANCH:-develop}
        ref: ${PWA_REF:-unknown}
        # One URL serves both callers (server components in the container, browser
        # on the host), so it has to be the host one — the container forwards that
        # port to the service (Dockerfile.pwa CMD).
        api_base_url: http://localhost:${SERVICE_PORT:-8100}
        channel: ${PWA_CHANNEL:-default-europe}
        checkout_key: ${CHECKOUT_API_KEY:-entirius-docker-checkout-dev-key-2026}
    profiles: [pwa]
    ports:
      - "${PWA_PORT:-3100}:3000"
    networks:
      - zeno

  cms:
    build:
      context: .
      dockerfile: docker/Dockerfile.cms
      args:
        repo: entirius-pwa-cms
        branch: ${CMS_BRANCH:-develop}
        ref: ${CMS_REF:-unknown}
    profiles: [cms]
    ports:
      - "${CMS_PORT:-8180}:8080"
    environment:
      # SPA — the browser talks to the service host port directly.
      VUE_APP_API_URL: http://localhost:${SERVICE_PORT:-8100}
      VUE_APP_CHANNEL: ${PWA_CHANNEL:-default-europe}
      VUE_APP_PANELS: pages,pim,points
      VUE_APP_LANG: EN
    networks:
      - zeno

  # Documentation portal — served from the repos/docs/ clone (private GitLab, see
  # make clone-docs) with hot reload; host port shifted +100 from Astro's 4321.
  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    profiles: [docs]
    ports:
      - "${DOCS_PORT:-4421}:4321"
    volumes:
      - ${DOCS_PATH:-./repos/docs}/entirius-docs:/entirius/docs
      - docs_node_modules:/entirius/docs/node_modules
    networks:
      - zeno

  # Second docs instance for a feature branch, side by side with develop (make docs-alt).
  docs-alt:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    profiles: [docs]
    ports:
      - "${DOCS_ALT_PORT:-4422}:4321"
    volumes:
      - ${DOCS_PATH:-./repos/docs}/entirius-docs-${DOCS_ALT_BRANCH:-alt}:/entirius/docs
      - docs_alt_node_modules:/entirius/docs/node_modules
    networks:
      - zeno

  # Marketing site entirius.com — Next.js dev server from repos/www/ (make www WWW_BRANCH=x).
  www:
    build:
      context: .
      dockerfile: docker/Dockerfile.www
    profiles: [www]
    ports:
      - "${WWW_PORT:-3200}:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:${WWW_PORT:-3200}
      ALLOWED_HOSTS: localhost,localhost:${WWW_PORT:-3200}
    volumes:
      - ${WWW_PATH:-./repos/www}/entirius-react-www-${WWW_BRANCH:-master}:/entirius/www
      - www_node_modules:/entirius/www/node_modules
      - www_next:/entirius/www/.next
    networks:
      - zeno

  # Zeno Suite — a generated dashboard (make dashboard) of the live stack: real ports,
  # which volkanos packages are editable from repos/ vs baked, test packages present.
  dashboard:
    image: python:3.12-slim
    profiles: [service]
    command: ["python", "-m", "http.server", "8080", "--directory", "/srv"]
    ports:
      - "${DASHBOARD_PORT:-8200}:8080"
    volumes:
      - ./docker/dashboard:/srv:ro
    networks:
      - zeno

  # Static HTTP for the test package (supplier feed downloads — the feed connector
  # speaks HTTP only). In-network only: no host port.
  fixtures:
    image: python:3.12-slim
    profiles: [service]
    command: ["python", "-m", "http.server", "8000", "--directory", "/entirius/test-package"]
    volumes:
      - ${TESTS_PATH:-./repos/tests}/entirius-test-package-emporium:/entirius/test-package:ro
    networks:
      - zeno

  # Celery worker — required by `make seed` (QMS quantities import runs as tasks).
  # Same image as the service; in dev mode it runs the BAKED code (no hot reload).
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        service: ${SERVICE:-entirius-service-volkanos}
        branch: ${SERVICE_BRANCH:-master}
        ref: ${SERVICE_REF:-unknown}
    profiles: [service]
    command: ["celery", "-A", "main", "worker", "-l", "info", "-Q", "celery,quantities,fill_product_representation,pricemanager_create_pricelist,contact_forms,contact_forms_conversions,lookup"]
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,service
      DATABASE_URL: postgresql://${POSTGRES_USER:-entirius}:${POSTGRES_PASSWORD:-entirius-dev}@db:5432/${POSTGRES_DB:-entirius}
      EMBED_MODEL: ${EMBED_MODEL:-google/siglip-so400m-patch14-384}
      EMBED_DIM: ${EMBED_DIM:-1152}
    volumes:
      - ${TESTS_PATH:-./repos/tests}/entirius-test-package-emporium:/entirius/test-package:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zeno

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  docs_node_modules:
  docs_alt_node_modules:
  www_node_modules:
  www_next:

networks:
  zeno:
    name: entirius-zeno
